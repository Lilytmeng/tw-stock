<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股支撐壓力分析器 v2</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--g:#168a55;--g2:#e8f7ef;--y:#b7791f;--y2:#fff6dc;--r:#d23b3b;--r2:#fff0f0;--b:#3167e3;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.hero{padding:25px;border-radius:24px;background:linear-gradient(135deg,#172033,#2b3f68);color:white;box-shadow:0 12px 30px #23314d22}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;line-height:1.7;color:#dce5f7}.search{display:flex;gap:10px;margin-top:18px}.search input{min-width:0;flex:1;border:0;border-radius:14px;padding:15px;font-size:18px}.search button{border:0;border-radius:14px;padding:0 20px;font-weight:900;background:#fff;color:#172033;cursor:pointer}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #ffffff40;background:#ffffff12;color:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.status{margin:14px 0;padding:13px 15px;border-radius:14px;background:#fff;border:1px solid var(--line);display:none;line-height:1.6}.head{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 12px}.name{font-size:24px;font-weight:900}.price{font-size:29px;font-weight:900;text-align:right}.sub{font-size:13px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 18px #1b2a4810}.full{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 12px}.support{border-top:5px solid var(--g)}.support2{border-top:5px solid #e0a229}.resist{border-top:5px solid var(--r)}.big{font-size:28px;font-weight:950;margin:4px 0 10px}.green{color:var(--g)}.amber{color:var(--y)}.red{color:var(--r)}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.pg{background:var(--g2);color:var(--g)}.py{background:var(--y2);color:var(--y)}.pr{background:var(--r2);color:var(--r)}.rows{border-top:1px solid var(--line);margin-top:12px;padding-top:7px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}.row span{color:var(--muted)}.explain{margin-top:10px;padding:11px 12px;border-radius:12px;background:#f7f9fc;line-height:1.65;font-size:14px}.meter{height:16px;border-radius:99px;background:linear-gradient(90deg,#bcebd2 0 38%,#f7dfa4 38% 62%,#ffc6c6 62%);position:relative;margin:30px 8px 40px}.needle{position:absolute;top:-8px;width:4px;height:32px;background:#172033;border-radius:3px;transform:translateX(-50%)}.needle:after{content:'現價';position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}.levels{display:grid;grid-template-columns:repeat(5,1fr);font-size:12px;text-align:center;gap:4px}.levels b{display:block;font-size:13px}.summary{font-size:16px;line-height:1.8}.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}.demo{background:#fff8db;color:#795b00;border-color:#f2d46c}.ok{background:#edf9f2;color:#11663f;border-color:#bfe6cf}@media(max-width:680px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.search{flex-direction:column}.search button{padding:14px}.head{align-items:start}.price{font-size:24px}.levels{font-size:10px}.levels b{font-size:11px}}
</style></head><body><div class="wrap"><section class="hero"><h1>📈 台股支撐壓力小幫手</h1><p>輸入股票代碼，我幫你把數字翻成白話：哪裡像「地板」、哪裡像「天花板」。</p><div class="search"><input id="code" inputmode="numeric" maxlength="6" value="2330" placeholder="例如 2330"><button type="button" id="go">開始分析</button></div><div class="chips"><button class="chip" data-code="2330">2330 台積電</button><button class="chip" data-code="2317">2317 鴻海</button><button class="chip" data-code="2454">2454 聯發科</button></div></section><div id="status" class="status"></div><main id="result" style="display:none"><div class="head"><div><div class="name" id="name">—</div><div class="sub" id="date">—</div></div><div><div class="price" id="price">—</div><div class="sub" style="text-align:right">最近收盤價</div></div></div><div class="grid"><section class="card support"><h2>🟢 1. 近端支撐</h2><div class="big green" id="near">—</div><span class="pill pg" id="nearTag">—</span><div class="rows"><div class="row"><span>MA10</span><b id="ma10">—</b></div><div class="row"><span>MA20</span><b id="ma20">—</b></div><div class="row"><span>法人估計成本</span><b id="inst">資料不足時不亂估</b></div></div><div class="explain" id="nearExplain"></div></section><section class="card support2"><h2>🟡 2. 次近端支撐</h2><div class="big amber" id="low20">—</div><span class="pill py">近20日低點</span><div class="explain" id="lowExplain"></div></section><section class="card resist"><h2>🔴 3. 關鍵突破／第一壓力</h2><div class="big red" id="r1">—</div><span class="pill pr" id="r1tag">—</span><div class="explain" id="r1Explain"></div></section><section class="card resist"><h2>🔴 4. 第二壓力</h2><div class="big red" id="r2">—</div><span class="pill pr">下一個壓力共振區</span><div class="explain" id="r2Explain"></div></section><section class="card full"><h2>🚦 現在在哪個位置？</h2><div class="meter"><div class="needle" id="needle"></div></div><div class="levels"><div>支撐②<b id="mS2">—</b></div><div>支撐①<b id="mS1">—</b></div><div>現價<b id="mP">—</b></div><div>壓力①<b id="mR1">—</b></div><div>壓力②<b id="mR2">—</b></div></div></section><section class="card full"><h2>💡 白話解讀</h2><div class="summary" id="summary"></div></section></div><div class="note">本工具僅作個人研究與技術面觀察。支撐、壓力是依歷史價格推算的觀察區，不代表一定反彈或突破；法人「實際成本」不是公開單一數字，因此沒有可靠法人資料時不顯示假數字。</div></main></div><script>
const $=x=>document.getElementById(x),fmt=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}),num=s=>Number(String(s).replaceAll(',',''));function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function rng(a,b){return Math.abs(a-b)<.01?fmt(a):`${fmt(Math.min(a,b))} ～ ${fmt(Math.max(a,b))}`}
function rocDateToKey(s){let p=s.split('/').map(Number);return (p[0]+1911)*10000+p[1]*100+p[2]}
async function getMonth(code,d){let ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+'01',u=`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${ds}&stockNo=${code}`;let r=await fetch(u,{mode:'cors'});if(!r.ok)throw Error('資料連線失敗');return r.json()}
function highs(a){let o=[];for(let i=2;i<a.length-2;i++)if(a[i].high>=a[i-1].high&&a[i].high>=a[i-2].high&&a[i].high>=a[i+1].high&&a[i].high>=a[i+2].high)o.push(a[i].high);return o}
function clusters(v,t=.018){v=[...new Set(v)].sort((a,b)=>a-b);let c=[];for(let x of v){let h=c.find(z=>Math.abs(x-avg(z))/avg(z)<=t);h?h.push(x):c.push([x])}return c.map(z=>({lo:Math.min(...z),hi:Math.max(...z),mid:avg(z),n:z.length}))}
function render(code,name,rows,isDemo=false){rows.sort((a,b)=>a.key-b.key);let last=rows.at(-1),a10=rows.slice(-10),a20=rows.slice(-20),ma10=avg(a10.map(x=>x.close)),ma20=avg(a20.map(x=>x.close)),lo20=Math.min(...a20.map(x=>x.low)),nlo=Math.min(ma10,ma20),nhi=Math.max(ma10,ma20),nmid=avg([ma10,ma20]);let hs=highs(rows.slice(-100)),mx20=Math.max(...a20.map(x=>x.high));hs.push(mx20);let cs=clusters(hs.filter(x=>x>last.close*1.002)).sort((a,b)=>a.mid-b.mid),one=cs[0]||{lo:mx20,hi:mx20,mid:mx20,n:1},two=cs.find(x=>x.mid>one.mid*1.025)||cs[1]||{lo:one.mid*1.05,hi:one.mid*1.05,mid:one.mid*1.05,n:0};$('name').textContent=`${code} ${name||''}`;$('date').textContent=`資料日期：${last.date}${isDemo?'｜示範資料':''}`;$('price').textContent=fmt(last.close);$('ma10').textContent=fmt(ma10);$('ma20').textContent=fmt(ma20);$('near').textContent=rng(nlo,nhi);$('nearTag').textContent=Math.abs(ma10-ma20)/ma20<=.015?'🟢 MA10＋MA20 靠近，共振較強':'🟡 MA10、MA20 距離較開';$('low20').textContent=fmt(lo20);$('r1').textContent=rng(one.lo,one.hi);$('r2').textContent=rng(two.lo,two.hi);let stood=last.close>one.hi;$('r1tag').textContent=stood?'🟢 已站上，觀察能否守住':'🔴 尚未站上，先視為壓力';$('nearExplain').innerHTML=`把這裡想成第一層「地板」。股價拉回時，先看 <b>${rng(nlo,nhi)}</b> 附近有沒有撐住。`;$('lowExplain').innerHTML=`如果第一層地板跌破，再看 <b>${fmt(lo20)}</b>。這是最近20個交易日曾出現的低點。`;$('r1Explain').innerHTML=`把這裡想成第一層「天花板」。${stood?'目前價格已越過，重點變成回測時能不能守住。':`股價往上到 <b>${rng(one.lo,one.hi)}</b> 時，要注意賣壓是否變大。`}`;$('r2Explain').innerHTML=`如果第一壓力真的突破，下一站先觀察 <b>${rng(two.lo,two.hi)}</b>。不是目標價，而是下一個容易遇到賣壓的位置。`;let pos=last.close<nlo?'⚠️ 已在近端支撐下方':last.close<=nhi?'🟢 正在近端支撐附近':last.close<one.lo?'🟡 位在支撐與第一壓力之間':last.close<=one.hi?'🔴 正在挑戰第一壓力':last.close<two.lo?'🟢 已越過第一壓力，往第二壓力靠近':'🔴 已到第二壓力附近或更高';$('summary').innerHTML=`目前 <b>${code}</b> 收盤 <b>${fmt(last.close)}</b>，${pos}。<br>往下先記 <b style="color:var(--g)">${rng(nlo,nhi)}</b>，跌破再看 <b style="color:var(--y)">${fmt(lo20)}</b>；往上先看 <b style="color:var(--r)">${rng(one.lo,one.hi)}</b>，突破後再看 <b style="color:var(--r)">${rng(two.lo,two.hi)}</b>。`;[['mS2',lo20],['mS1',nmid],['mP',last.close],['mR1',one.mid],['mR2',two.mid]].forEach(([id,v])=>$(id).textContent=fmt(v));let mn=Math.min(lo20,nmid,last.close,one.mid,two.mid),mx=Math.max(lo20,nmid,last.close,one.mid,two.mid);$('needle').style.left=(5+(last.close-mn)/(mx-mn||1)*90)+'%';$('result').style.display='block'}
function demo(code){let base=code==='2317'?205:code==='2454'?1450:1250,names={2330:'台積電',2317:'鴻海',2454:'聯發科'},rows=[];for(let i=0;i<90;i++){let trend=base*(.86+i*.0017),wave=Math.sin(i/5)*base*.018,c=trend+wave,o=c*(1+Math.sin(i)*.004),h=Math.max(o,c)*1.012,l=Math.min(o,c)*.988;rows.push({key:i,date:`示範日 ${i+1}`,open:o,high:h,low:l,close:c})}render(code,names[code]||'示範股票',rows,true)}
async function analyze(){let code=$('code').value.trim();if(!/^\d{4,6}$/.test(code)){msg('請輸入股票代碼，例如 2330。');return}msg('⏳ 正在讀取資料並計算…');$('result').style.display='none';$('go').disabled=true;try{let now=new Date(),js=[];for(let i=0;i<6;i++)js.push(await getMonth(code,new Date(now.getFullYear(),now.getMonth()-i,1)));let rows=[],name='';for(let j of js){if(j.stat==='OK'&&j.data){let m=(j.title||'').match(/\d+\s+(.+?)\s+各日成交資訊/);if(m)name=m[1];for(let x of j.data)rows.push({key:rocDateToKey(x[0]),date:x[0],open:num(x[3]),high:num(x[4]),low:num(x[5]),close:num(x[6])})}}let map=new Map(rows.map(x=>[x.key,x]));rows=[...map.values()];if(rows.length<30)throw Error('找不到足夠的上市股票資料');render(code,name,rows);msg('✅ 分析完成。綠色＝支撐、黃色＝第二層支撐、紅色＝壓力。','ok')}catch(e){demo(code);msg('⚠️ 你的瀏覽器目前阻擋了證交所即時連線，所以先用「示範資料」讓按鈕與完整介面可以測試。要讓任何股票代碼都抓真實資料，需要把這個頁面放到網站伺服器並接一個後端資料 API。','demo')}finally{$('go').disabled=false}}
function msg(t,c=''){let s=$('status');s.style.display='block';s.className='status '+c;s.innerHTML=t}$('go').addEventListener('click',analyze);$('code').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('code').value=b.dataset.code;analyze()});
</script></body></html>
